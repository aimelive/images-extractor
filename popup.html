<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Images Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="app-header">
        <div class="brand">
          <img class="brand-logo" src="icons/icon128.png" alt="" width="34" height="34" />
          <div class="brand-text">
            <h1>Images Extractor</h1>
            <p class="subtitle">Every image on this page</p>
          </div>
        </div>
        <button id="refreshBtn" class="icon-btn" type="button" title="Refresh" aria-label="Refresh images">
          <span class="icon-btn__glyph">↻</span>
        </button>
      </header>

      <!-- Toolbar -->
      <div class="toolbar">
        <span id="imageCount" class="count">0 images</span>
        <span class="hint">Click a thumbnail to copy its URL</span>
      </div>

      <!-- Loading (skeleton) -->
      <div id="loading" class="loading">
        <div class="skeleton-grid">
          <span class="skel"></span><span class="skel"></span><span class="skel"></span>
          <span class="skel"></span><span class="skel"></span><span class="skel"></span>
        </div>
        <p class="loading-text">Scanning the page for images…</p>
      </div>

      <!-- Error -->
      <div id="error" class="status status--error" style="display: none">
        <div class="status__icon">!</div>
        <p>Unable to extract images. Please try again.</p>
      </div>

      <!-- Results -->
      <div id="imagesList" class="images-list"></div>

      <!-- Empty -->
      <div id="emptyState" class="status status--empty" style="display: none">
        <div class="status__icon">🖼️</div>
        <p>No images found on this page.</p>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>

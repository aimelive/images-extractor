<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found - Images Extractor</title>
    <meta name="description" content="That page doesn't exist." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#2e5e2e" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/icon128.png" />
    <style>
      :root {
        --brand-gradient: linear-gradient(
          135deg,
          #2e5e2e 0%,
          #5c8c28 55%,
          #70a030 100%
        );
        --brand-solid: #2e5e2e;
        --brand-solid-hover: #214521;
        --ink: #14201a;
        --muted: #5d6b62;
        --line: #e6ece1;
        --bg: #f3f6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        text-align: center;
        line-height: 1.65;
        color: var(--ink);
        background:
          radial-gradient(
            900px 520px at 88% -8%,
            rgba(159, 193, 91, 0.22) 0%,
            transparent 60%
          ),
          radial-gradient(
            820px 520px at 4% 4%,
            rgba(112, 160, 48, 0.14) 0%,
            transparent 55%
          ),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin: 0 auto 24px;
        display: block;
        box-shadow: 0 10px 26px rgba(46, 94, 46, 0.24);
      }
      .code {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #70a030;
      }
      h1 {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        letter-spacing: -0.02em;
        margin: 8px 0 12px;
      }
      p {
        color: var(--muted);
        max-width: 440px;
        margin: 0 auto 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 15px;
        font-weight: 700;
        padding: 13px 24px;
        border-radius: 12px;
        text-decoration: none;
        color: #fff;
        background: var(--brand-gradient);
        box-shadow: 0 18px 48px rgba(46, 94, 46, 0.3);
        transition: transform 0.18s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .links {
        margin-top: 26px;
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .links a {
        color: var(--muted);
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
      }
      .links a:hover {
        color: var(--brand-solid-hover);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon128.png" alt="Images Extractor logo" />
      <div class="code">Error 404</div>
      <h1>We couldn't find that page</h1>
      <p>
        The link may be out of date. Everything about Images Extractor lives on
        the home page.
      </p>
      <a class="btn" href="/">← Back to Images Extractor</a>
      <div class="links">
        <a href="/#features">Features</a>
        <a href="/#install">Install</a>
        <a href="/#usage">How it works</a>
        <a href="/#faq">FAQ</a>
      </div>
    </main>
  </body>
</html>
